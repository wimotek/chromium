services:
  wimotek-url:
    image: ghcr.io/wimotek/url:latest
    container_name: wimotek-url
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      WIMOTEK_DATA_DIR: /data
      WIMOTEK_CERTS_DIR: /certs
      WIMOTEK_HTTP_ADDR: ":8080"
      WIMOTEK_HTTPS_ADDR: ":8443"
      # Optional wimotek/Oauth (OIDC 1.0 + PKCE S256) configuration.
      # Leave OAUTH_SECRET unset on first deployment to sign in locally first.
      OAUTH_ISSUER: "https://auth.wimotek.com"
      OAUTH_CLIENT_ID: "wimotek_c41ac24274c6"
      OAUTH_SECRET: "${OAUTH_SECRET:-}"
      OAUTH_REDIRECT_URI: "${OAUTH_REDIRECT_URI:-https://wimotek.com/auth/callback}"
      OAUTH_WEBHOOK_SECRET: "${OAUTH_WEBHOOK_SECRET:-}"
    volumes:
      - ./data:/data
      # Optional read-only TLS certificate mount (fullchain.pem & privkey.pem).
      # Leave empty or remove to automatically generate self-signed TLS certificates in /data/certs.
      - ./certs:/certs:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
