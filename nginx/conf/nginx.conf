worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx/nginx.pid;
error_log /data/logs/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 版本号与非 Root 临时目录配置
    server_tokens off;
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /data/logs/access.log main;

    # WebSocket / SSE 反向代理通用连接升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 零拷贝、大文件上传与高并发网络调优（兼容 WordPress 媒体库 / Nextcloud 上传）
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 64m;

    # FastCGI 缓冲区调优（避免 WordPress / WooCommerce / Laravel 大 Cookie 触发 502）
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout    120s;
    fastcgi_read_timeout    120s;
    fastcgi_buffer_size     32k;
    fastcgi_buffers         16 16k;
    fastcgi_busy_buffers_size 64k;

    # 标准 Gzip 动态压缩（与官方默认模块 100% 兼容）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        font/woff2
        image/svg+xml;

    # 若构建时开启了 --build-arg ENABLE_GZIP_STATIC=true，可取消下方注释启用 .gz 预压缩直出：
    # gzip_static on;

    # 现代 TLS 默认参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 引入站点虚拟主机配置（统一收纳于 /data/conf.d）
    include /data/conf.d/*.conf;
}
