name: Publish chromium-sync to PyPI and npm

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'chromium_sync/**'
      - '.github/workflows/publish_chromium_sync_npm_pypi.yml'
    tags:
      - 'sync-v*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./chromium_sync

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (用于自动同步版本)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 【核心新增】全自动计算并注入版本号
      - name: Auto bump version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "Current Publishing Version: $VERSION"

          # 自动替换 pyproject.toml 里的版本号
          sed -i -E 's/^[[:space:]]*version[[:space:]]*=.*/version = "'"$VERSION"'"/' pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      # 【新增】上传前本地预检，如果有 Markdown 语法错误会提前指出
      - name: Check package metadata
        run: python -m twine check dist/*

      # 【修改】加入 --verbose 参数，如果报错会打印 PyPI 官方给出的详细原因
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --verbose dist/*

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # 【核心新增】同步版本号到 package.json
      - name: Auto bump version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "Current Publishing Version: $VERSION"

          # 自动更新 package.json 里的版本号
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
