name: Build & Push Chromium SaaS Hub (Closed-Source Binary Image)

on:
  push:
    branches:
      - main
      - master
    paths:
      - "chromium/chromium_sync_saas/**"
      - ".github/workflows/build-saas-hub.yml"
    tags:
      - "saas-v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target architectures (comma-separated)"
        required: true
        type: string
        default: "linux/amd64,linux/arm64"
      extra_tag:
        description: "Optional additional tag (e.g. saas-v1.0.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-saas:
    name: Build & Push SaaS Binary Image (Docker Hub + GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-build syntax & script checks
        run: |
          bash -n chromium/chromium_sync_saas/entrypoint.sh
          python3 -m py_compile \
            chromium/chromium_sync_saas/app/backend/*.py \
            chromium/chromium_sync_saas/app/backend/core/*.py \
            chromium/chromium_sync_saas/app/backend/services/*.py \
            chromium/chromium_sync_saas/app/backend/routers/*.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: dockerhub_login
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'wimotek' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags and target platforms
        id: meta
        env:
          DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          OWNER_LC="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR_REPO="ghcr.io/${OWNER_LC}/chromium"
          DOCKERHUB_REPO="wimotek/chromium"
          SHORT_SHA="${GITHUB_SHA::7}"

          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"

          EXTRA_VER=""
          if [[ "${{ github.ref }}" == refs/tags/saas-v* ]]; then
            EXTRA_VER="${{ github.ref_name }}"
          elif [[ -n "${INPUT_EXTRA_TAG// /}" ]]; then
            EXTRA_VER="${INPUT_EXTRA_TAG// /}"
          fi

          TAGS="${GHCR_REPO}:saas"$'\n'"${GHCR_REPO}:saas-sha-${SHORT_SHA}"
          if [[ -n "$EXTRA_VER" ]]; then
            TAGS="${TAGS}"$'\n'"${GHCR_REPO}:${EXTRA_VER}"
          fi

          if [[ "$DOCKERHUB_TOKEN_SET" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_REPO}:saas"
            if [[ -n "$EXTRA_VER" ]]; then
              TAGS="${TAGS}"$'\n'"${DOCKERHUB_REPO}:${EXTRA_VER}"
            fi
          else
            echo "::warning::未配置 DOCKERHUB_TOKEN Secret，本次仅推送 GHCR (${GHCR_REPO}:saas)；请在仓库 Secrets 中添加 DOCKERHUB_TOKEN（可选 DOCKERHUB_USERNAME，默认 wimotek）以同步推送 ${DOCKERHUB_REPO}:saas"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "platforms=${PLATFORMS}"
            echo "ghcr_image=${GHCR_REPO}:saas"
            echo "dockerhub_enabled=${DOCKERHUB_TOKEN_SET}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push closed-source binary SaaS image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: chromium/chromium_sync_saas
          file: chromium/chromium_sync_saas/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Chromium Sync SaaS Hub (Binary)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify built linux/amd64 image contains only compiled binaries (no .py sources)
        uses: docker/build-push-action@v6
        with:
          context: chromium/chromium_sync_saas
          file: chromium/chromium_sync_saas/Dockerfile
          platforms: linux/amd64
          load: true
          tags: saas-binary-verify:local
          cache-from: type=gha

      - name: Assert runtime closed-source layout & binary self-test
        run: |
          docker run --rm --entrypoint sh saas-binary-verify:local -c '
            set -e
            PY_LEFT=$(find /app/backend -type f \( -name "*.py" -o -name "*.pyc" -o -name "*.c" -o -name "*.pyx" \) | wc -l)
            echo "Backend source/intermediate files found: ${PY_LEFT}"
            test "${PY_LEFT}" = "0"
            test -x /app/backend/chromium-sync-saas
            file /app/backend/chromium-sync-saas || true
            DATA_DIR=/tmp/verify_saas /app/backend/chromium-sync-saas --self-test
          '

      - name: Write workflow summary
        run: |
          {
            echo "### Chromium Sync SaaS 闭源二进制镜像构建完成"
            echo ""
            echo "- **GHCR**: \`${{ steps.meta.outputs.ghcr_image }}\`"
            if [[ "${{ steps.meta.outputs.dockerhub_enabled }}" == "true" ]]; then
              echo "- **Docker Hub**: \`wimotek/chromium:saas\` (已推送)"
            else
              echo "- **Docker Hub**: 未推送（缺少 \`DOCKERHUB_TOKEN\` Secret）"
            fi
            echo "- **构建架构**: \`${{ steps.meta.outputs.platforms }}\`"
            echo "- **二进制校验**: \`/app/backend/chromium-sync-saas\` ELF 启动器与剥离符号 \`.so\` 模块自检通过，运行时镜像 \`/app/backend\` 源码残留为 0。"
          } >> "$GITHUB_STEP_SUMMARY"
