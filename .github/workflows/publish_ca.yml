name: Build, Release & Publish Wimotek PKI Suite (ca + ca:cli)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - 'ca/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ca
  WORKING_DIR: ./ca

jobs:
  test-and-binaries:
    name: Test & Cross-Compile Static Binaries (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build embedded CA frontend assets
        working-directory: ${{ env.WORKING_DIR }}/ca/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            ${{ env.WORKING_DIR }}/ca/go.sum
            ${{ env.WORKING_DIR }}/cli/go.sum

      - name: Verify go mod tidy & unit tests (ca/ca)
        working-directory: ${{ env.WORKING_DIR }}/ca
        run: |
          go mod tidy
          CGO_ENABLED=0 go test -v ./...

      - name: Verify go mod tidy & unit tests (ca/cli)
        working-directory: ${{ env.WORKING_DIR }}/cli
        run: |
          go mod tidy
          CGO_ENABLED=0 go test -v ./...

      - name: Cross-compile static binaries (wimotek-ca & wimotek-cli)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist-bin"
          VER="${GITHUB_REF_NAME:-dev}"
          # Build wimotek-ca
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go -C "${WORKING_DIR}/ca" build -trimpath -ldflags="-s -w" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-ca-linux-amd64" ./cmd/server
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go -C "${WORKING_DIR}/ca" build -trimpath -ldflags="-s -w" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-ca-linux-arm64" ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C "${WORKING_DIR}/ca" build -trimpath -ldflags="-s -w" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-ca-windows-amd64.exe" ./cmd/server
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go -C "${WORKING_DIR}/ca" build -trimpath -ldflags="-s -w" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-ca-darwin-arm64" ./cmd/server
          # Build wimotek-cli
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go -C "${WORKING_DIR}/cli" build -trimpath -ldflags="-s -w -X main.Version=${VER}" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-cli-linux-amd64" ./cmd/wimotek-cli
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go -C "${WORKING_DIR}/cli" build -trimpath -ldflags="-s -w -X main.Version=${VER}" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-cli-linux-arm64" ./cmd/wimotek-cli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C "${WORKING_DIR}/cli" build -trimpath -ldflags="-s -w -X main.Version=${VER}" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-cli-windows-amd64.exe" ./cmd/wimotek-cli
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go -C "${WORKING_DIR}/cli" build -trimpath -ldflags="-s -w -X main.Version=${VER}" -o "${GITHUB_WORKSPACE}/dist-bin/wimotek-cli-darwin-arm64" ./cmd/wimotek-cli
          (cd "${GITHUB_WORKSPACE}/dist-bin" && sha256sum * > checksums.txt)

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wimotek-pki-binaries
          path: dist-bin/*

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true

  docker-publish:
    name: Build & Push Multi-Arch Images (ca:latest & ca:cli -> Docker Hub & GHCR)
    needs: test-and-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve target Docker registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LOWER="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (CA Server -> ca:latest / ca:<version>)
        id: meta-ca
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.registries.outputs.owner_lower }}/${{ env.IMAGE_NAME }}
            ${{ steps.registries.outputs.dockerhub_enabled == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch CA Server image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}/ca
          file: ${{ env.WORKING_DIR }}/ca/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ca.outputs.tags }}
          labels: ${{ steps.meta-ca.outputs.labels }}
          cache-from: type=gha,scope=ca-server
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ca-server' || '' }}

      - name: Extract Docker metadata (CLI Client -> ca:cli / ca:cli-<version>)
        id: meta-cli
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.registries.outputs.owner_lower }}/${{ env.IMAGE_NAME }}
            ${{ steps.registries.outputs.dockerhub_enabled == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=cli
            type=semver,pattern=cli-{{version}}
            type=semver,pattern=cli-{{major}}.{{minor}}
            type=sha,prefix=cli-sha-

      - name: Build and push multi-arch CLI Client image (ca:cli)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}/cli
          file: ${{ env.WORKING_DIR }}/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=ca-cli
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ca-cli' || '' }}

      - name: Sync ca/README.md to Docker Hub `ca` repository overview
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub_enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ${{ env.WORKING_DIR }}/README.md
          short-description: "Lightweight zero-config enterprise CA server (ca:latest) & step-aligned PKI CLI/Web Manager (ca:cli)"
