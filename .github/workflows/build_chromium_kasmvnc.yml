name: Build chromium_kasmvnc Edition

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'chromium_kasmvnc/**'                         # 仅当 kasmvnc 目录变动时触发
      - '.github/workflows/build-kasmvnc.yml'
    tags: [ 'v*.*.*' ]
  workflow_dispatch:                         # 支持网页手动单独点击触发

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/minimal-chromium

jobs:
  build-kasmvnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=kasmvnc
            type=semver,pattern={{version}}-kasmvnc

      - name: Build and push KasmVNC
        uses: docker/build-push-action@v6
        with:
          context: ./chromium_kasmvnc                 # 指定构建目录为 kasmvnc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 【核心新增】将项目根目录的 README.md 同步到 Docker Hub 主页
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md                          # 指定 README 文件路径
          short-description: "Minimal Chromium with KasmVNC/noVNC, CDP, and Clipboard sync" # 列表副标题简介
