name: Build and Push KasmVNC Edition (Binary)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "chromium/chromium_kasmvnc/**"
      - ".github/workflows/*kasm*.yml"
      - "chromium/common/**"
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target architectures (comma-separated)"
        required: true
        type: string
        default: "linux/amd64,linux/arm64"

# 必须赋予 packages: write 权限才能推送到 ghcr.io
permissions:
  contents: read
  packages: write

env:
  WORKING_DIR: ./chromium/chromium_kasmvnc

jobs:
  build-kasmvnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare common client & pre-build checks
        run: |
          cp chromium/common/edge_node_client.py chromium/chromium_kasmvnc/edge_node_client.py
          cp chromium/common/build_edge_binary.py chromium/chromium_kasmvnc/build_edge_binary.py
          rm -rf chromium/chromium_kasmvnc/desktop
          cp -r chromium/common/desktop chromium/chromium_kasmvnc/desktop
          bash -n chromium/chromium_kasmvnc/entrypoint.sh
          python3 -m py_compile chromium/common/edge_node_client.py chromium/common/build_edge_binary.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags and targets
        id: meta
        env:
          DOCKERHUB_TOKEN_VAL: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USER_VAL: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          OWNER_LC="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR_REPO="ghcr.io/${OWNER_LC}/chromium"
          DOCKERHUB_USER="${DOCKERHUB_USER_VAL:-wimotek}"
          DOCKERHUB_REPO="${DOCKERHUB_USER}/chromium"
          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"

          EXTRA_VER=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            EXTRA_VER="${{ github.ref_name }}"
            EXTRA_VER="${EXTRA_VER#v}"
          fi

          TAGS="${GHCR_REPO}:kasmvnc"
          if [[ -n "$EXTRA_VER" ]]; then
            TAGS="${TAGS}"$'\n'"${GHCR_REPO}:${EXTRA_VER}-kasmvnc"
          fi

          if [[ -n "$DOCKERHUB_TOKEN_VAL" ]]; then
            DOCKERHUB_ENABLED="true"
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_REPO}:kasmvnc"
            if [[ -n "$EXTRA_VER" ]]; then
              TAGS="${TAGS}"$'\n'"${DOCKERHUB_REPO}:${EXTRA_VER}-kasmvnc"
            fi
          else
            DOCKERHUB_ENABLED="false"
            echo "::warning::未配置 DOCKERHUB_TOKEN Secret，本次仅推送 GHCR (${GHCR_REPO}:kasmvnc)"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "platforms=${PLATFORMS}"
            echo "dockerhub_repo=${DOCKERHUB_REPO}"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED}"
          } >> "$GITHUB_OUTPUT"

      # 1. 登录到 GitHub Packages (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 登录到 Docker Hub
      - name: Log in to Docker Hub
        if: steps.meta.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'wimotek' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 执行多架构构建并双端同时推送
      - name: Build and push KasmVNC
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Chromium KasmVNC Edge Node (Binary)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify built linux/amd64 image contains compiled edge binary only
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kasmvnc-binary-verify:local
          cache-from: type=gha

      - name: Assert edge binary self-test & no source leak
        run: |
          docker run --rm --entrypoint sh kasmvnc-binary-verify:local -c '
            set -e
            test ! -f /opt/edge_node_client.py
            PY_LEFT=$(find /opt -maxdepth 1 -type f \( -name "*.py" -o -name "*.pyc" -o -name "*.pyx" -o -name "*.c" \) | wc -l)
            echo "Edge /opt source/intermediate files found: ${PY_LEFT}"
            test "${PY_LEFT}" = "0"
            test -x /opt/edge-node-client
            /opt/edge-node-client --self-test
          '
