name: Build and Push KasmVNC Edition

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'chromium_kasmvnc/**'
      - '.github/workflows/*kasm*.yml'
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# 必须赋予 packages: write 权限才能推送到 ghcr.io
permissions:
  contents: read
  packages: write

jobs:
  build-kasmvnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. 登录到 GitHub Packages (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 提取标签元数据（同时生成 Docker Hub 和 GHCR 的双端标签）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minimal-chromium
            ghcr.io/${{ github.repository_owner }}/minimal-chromium
          tags: |
            type=raw,value=kasmvnc
            type=semver,pattern={{version}}-kasmvnc

      # 4. 执行多架构构建并双端同时推送
      - name: Build and push KasmVNC
        uses: docker/build-push-action@v6
        with:
          context: ./chromium_kasmvnc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. 更新 Docker Hub 主页的 README 说明文档
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/minimal-chromium
          readme-filepath: ./README.md
          short-description: "Chromium in Docker with KasmVNC (60FPS), CDP and Clipboard sync"
