name: Build Xray Docker Image

on:
  push:
    paths:
      - 'xray/**'
      - '.github/workflows/build_xray.yml'
    branches:
      - main
  schedule:
    # 每周日 00:00 UTC 自动检测并构建官方最新版
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Xray 版本 (默认 auto 自动获取最新版；亦可手动输入如 25.1.30)'
        required: false
        default: 'auto'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 获取官方最新版本号 + 区分 Tag 与数字版本 + 用户名强制转小写
      - name: Prepare Environment & Version
        id: prep
        run: |
          # 1.1 强制用户名转小写，防止 Docker 镜像名大写报错
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$REPO_OWNER" >> $GITHUB_OUTPUT

          # 1.2 获取 XTLS 官方最新版本 Release
          RAW_VER=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "null" ]; then
            RAW_VER=$(curl -sSI https://github.com/XTLS/Xray-core/releases/latest | grep -i "^location:" | sed -n 's/.*tag\/\([^\r\n]*\).*/\1/p' | tr -d '\r\n')
          fi

          # 手动触发参数优先
          INPUT_VER="${{ github.event.inputs.xray_version }}"
          if [ -n "$INPUT_VER" ] && [ "$INPUT_VER" != "auto" ]; then
            RAW_VER="$INPUT_VER"
          fi

          # 1.3 规范化：TAG_NAME 必须带 v（给下载用），CLEAN_VER 去掉 v（给镜像打标签用）
          case "$RAW_VER" in
            v*) TAG_NAME="$RAW_VER"; CLEAN_VER="${RAW_VER#v}" ;;
            *)  TAG_NAME="v$RAW_VER"; CLEAN_VER="$RAW_VER" ;;
          esac

          echo "Official Download Tag: $TAG_NAME"
          echo "Docker Image Tag: $CLEAN_VER"

          echo "download_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. 登录 GHCR (系统原生变量，免配 Secret)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 3. 如果配置了 Docker Hub Secret，则同时登录
      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 生成多仓库镜像 Tags
      - name: Compute Image Tags
        id: tags
        run: |
          OWNER=
