name: Build Xray Docker Image

on:
  push:
    paths:
      - 'xray/**'
      - '.github/workflows/build_xray.yml'
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Xray 版本 (默认 auto 自动获取最新版)'
        required: false
        default: 'auto'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 自动获取官方最新版本号 + 仓库名强制转小写防报错
      - name: Prepare Environment & Version
        id: prep
        run: |
          # 解决 Docker 镜像名不能含有大写字母的致命问题
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$REPO_OWNER" >> $GITHUB_OUTPUT

          # 获取 Xray 官方最新版本号
          INPUT_VER="${{ github.event.inputs.xray_version }}"
          if [ -n "$INPUT_VER" ] && [ "$INPUT_VER" != "auto" ] && [ "$INPUT_VER" != "latest" ]; then
            VERSION="$INPUT_VER"
          else
            echo "Fetching latest version from XTLS/Xray-core..."
            VERSION=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name | sed 's/^v//')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              VERSION=$(curl -sSI https://github.com/XTLS/Xray-core/releases/latest | grep -i "^location:" | sed -n 's/.*tag\/v*\([0-9.]*\).*/\1/p' | tr -d '\r\n')
            fi
          fi

          VERSION=${VERSION:-latest}
          echo "Target Xray Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. 登录 GHCR (免配置，系统内置)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 3. 仅当配置了 Docker Hub 密钥时才登录
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 生成 Tags（区分纯 GHCR 还是双推送）
      - name: Compute Image Tags
        id: tags
        run: |
          OWNER="${{ steps.prep.outputs.owner_lc }}"
          VER="${{ steps.prep.outputs.version }}"
          
          # GHCR 默认必推
          TAG_LIST="ghcr.io/${OWNER}/xray:latest"
          if [ "$VER" != "latest" ]; then
            TAG_LIST="${TAG_LIST},ghcr.io/${OWNER}/xray:${VER}"
          fi

          # 如果配置了 Docker Hub，追加 Docker Hub 的 Tag
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DH_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
            TAG_LIST="${TAG_LIST},${DH_USER}/xray:latest"
            if [ "$VER" != "latest" ]; then
              TAG_LIST="${TAG_LIST},${DH_USER}/xray:${VER}"
            fi
          fi

          echo "tags=$TAG_LIST" >> $GITHUB_OUTPUT

      # 5. 构建并推送多架构镜像
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ./xray
          file: ./xray/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            XRAY_VERSION=${{ steps.prep.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. 如果有 DockerHub 密钥，同步更新 Docker Hub 的 README
      - name: Update Docker Hub Description
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/xray
          readme-filepath: ./xray/README.md
          short-description: "Optimized Standalone Xray Server with REALITY and Auto-Update"
