name: Build & Release Windows Edge CDP Node

on:
  push:
    branches:
      - main
      - master
    paths:
      - "chromium/chromium_windows/**"
      - ".github/workflows/build-windows-node.yml"
    tags:
      - "win-v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish artifacts to GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag when triggered manually (e.g. win-v1.2.0)"
        required: false
        type: string
        default: "win-v1.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages (Portable ZIP, Setup EXE, OneFile EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: chromium/chromium_windows/requirements.txt

      - name: Install dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r chromium/chromium_windows/requirements.txt
          pip install pyinstaller

      - name: Determine release version & tag
        id: rel_meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $ver = if ($tag -match '^win-v(\d+\.\d+\.\d+)$') { $matches[1] } else { "1.2.0" }
            $should = "true"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}".Trim()
            if (-not $tag) { $tag = "win-v1.2.0" }
            $ver = if ($tag -match '^win-v(\d+\.\d+\.\d+)$') { $matches[1] } else { "1.2.0" }
            $should = if ("${{ inputs.create_release }}" -eq "true") { "true" } else { "false" }
          } elseif ("${{ github.event_name }}" -eq "push") {
            $tags = git ls-remote --tags --refs origin "win-v*" 2>$null
            $best = $null
            foreach ($line in $tags) {
              if ($line -match 'refs/tags/win-v(\d+)\.(\d+)\.(\d+)$') {
                $v = [version]::new([int]$matches[1], [int]$matches[2], [int]$matches[3])
                if ($null -eq $best -or $v -gt $best) { $best = $v }
              }
            }
            $floorVer = [version]::new(1, 2, 0)
            if ($null -eq $best -or $best -lt $floorVer) {
              $ver = "1.2.0"
            } else {
              $ver = "$($best.Major).$($best.Minor).$($best.Build + 1)"
            }
            $tag = "win-v$ver"
            $should = "true"
          } else {
            $ver = "1.2.0"
            $tag = ""
            $should = "false"
          }
          Write-Host "Resolved release tag=$tag, app_version=$ver, should_release=$should"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_release=$should" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stamp APP_VERSION into Windows client source
        shell: pwsh
        run: |
          $ver = "${{ steps.rel_meta.outputs.app_version }}"
          if (-not $ver) { $ver = "1.2.0" }
          $mainPath = "chromium/chromium_windows/main.py"
          $content = Get-Content $mainPath -Raw -Encoding utf8
          $updated = [regex]::Replace($content, 'APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$ver`"")
          Set-Content -Path $mainPath -Value $updated -Encoding utf8 -NoNewline
          Write-Host "Stamped APP_VERSION=$ver into $mainPath"

      - name: Run unit & import sanity checks
        shell: pwsh
        run: |
          python -B -m py_compile chromium/chromium_windows/*.py
          $env:PYTHONPATH = "chromium/chromium_windows"
          python -c "import PySide6.QtWidgets, qfluentwidgets, cookie_guard, browser_launcher, win_edge_agent, main; print('Imports OK, version=', main.APP_VERSION)"

      - name: Build OneDir GUI, OneFile GUI, and Lightweight CLI
        shell: pwsh
        run: |
          $commonExcludes = @(
            "--exclude-module", "PySide6.QtWebEngineCore",
            "--exclude-module", "PySide6.QtWebEngineWidgets",
            "--exclude-module", "PySide6.QtWebEngineQuick",
            "--exclude-module", "PySide6.QtQuick",
            "--exclude-module", "PySide6.QtQml",
            "--exclude-module", "PySide6.Qt3DCore",
            "--exclude-module", "PySide6.Qt3DRender",
            "--exclude-module", "PySide6.QtMultimedia",
            "--exclude-module", "PySide6.QtPdf",
            "--exclude-module", "PySide6.QtCharts",
            "--exclude-module", "PySide6.QtDataVisualization"
          )

          # 1. 多文件目录版 (启动最快、用于绿色 ZIP 与安装包)
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name WimotekEdgeNode `
            --icon chromium/chromium_windows/assets/app_icon.ico `
            --add-data "chromium/chromium_windows/assets;assets" `
            --paths chromium/chromium_windows `
            --collect-all qfluentwidgets `
            --hidden-import=cryptography `
            --hidden-import=websockets `
            --hidden-import=httpx `
            @commonExcludes `
            chromium/chromium_windows/main.py

          # 2. 单文件便携版 GUI EXE
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name WimotekEdgeNode-onefile `
            --icon chromium/chromium_windows/assets/app_icon.ico `
            --add-data "chromium/chromium_windows/assets;assets" `
            --paths chromium/chromium_windows `
            --collect-all qfluentwidgets `
            --hidden-import=cryptography `
            --hidden-import=websockets `
            --hidden-import=httpx `
            @commonExcludes `
            chromium/chromium_windows/main.py

          # 3. 轻量无界面 CLI EXE (排除 PySide6/Qt，约 12~15 MB)
          pyinstaller --noconfirm --clean --onefile --console `
            --name WimotekEdgeNode-cli `
            --icon chromium/chromium_windows/assets/app_icon.ico `
            --paths chromium/chromium_windows `
            --hidden-import=cryptography `
            --hidden-import=websockets `
            --hidden-import=httpx `
            --exclude-module PySide6 `
            --exclude-module qfluentwidgets `
            chromium/chromium_windows/main.py

      - name: Stage multi-file portable package & build Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_stage/WimotekEdgeNode | Out-Null
          Copy-Item -Recurse -Force dist/WimotekEdgeNode/* release_stage/WimotekEdgeNode/
          Copy-Item dist/WimotekEdgeNode-cli.exe release_stage/WimotekEdgeNode/
          Copy-Item chromium/chromium_windows/README.md release_stage/WimotekEdgeNode/
          Copy-Item chromium/chromium_windows/config.example.json release_stage/WimotekEdgeNode/

          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Copy-Item dist/WimotekEdgeNode-onefile.exe release_assets/
          Copy-Item dist/WimotekEdgeNode-cli.exe release_assets/

          # 打包多文件绿色版 ZIP (包含 WimotekEdgeNode 文件夹，解压即秒开)
          Compress-Archive -Path release_stage/WimotekEdgeNode `
            -DestinationPath release_assets/WimotekEdgeNode-win64-portable.zip -Force

          # 查找或安装 Inno Setup 6 编译标准 Windows 安装包
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          $ver = "${{ steps.rel_meta.outputs.app_version }}"
          if (-not $ver) { $ver = "1.2.0" }
          & $iscc "/DMyAppVersion=$ver" "chromium/chromium_windows/installer.iss"

          $files = Get-ChildItem release_assets -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release_assets/SHA256SUMS.txt -Encoding utf8

          Get-ChildItem release_assets -File | Select-Object Name, @{Name="MB";Expression={[math]::Round($_.Length/1MB,2)}}
          Get-Content release_assets/SHA256SUMS.txt

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WimotekEdgeNode-win64
          path: release_assets/*
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.rel_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag }}
          name: "Wimotek Windows Edge CDP Node ${{ steps.rel_meta.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_assets/WimotekEdgeNode-Setup-win64.exe
            release_assets/WimotekEdgeNode-win64-portable.zip
            release_assets/WimotekEdgeNode-onefile.exe
            release_assets/WimotekEdgeNode-cli.exe
            release_assets/SHA256SUMS.txt
