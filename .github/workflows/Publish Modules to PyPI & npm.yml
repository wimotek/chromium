name: Auto Build & Publish Modules to PyPI & npm

on:
  push:
    branches:
      - main
    paths:
      - 'Module/**'
      - '.github/workflows/publish-modules.yml'
  workflow_dispatch:

jobs:
  auto-publish:
    name: Build & Auto-Version Publish
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安装 Python 环境与打包依赖
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade build twine tomli-w

      # 3. 安装现代 Node.js 22 LTS 环境 (消除 Node 20 废弃警告)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 4. 生成独立的版本读写辅助脚本 (彻底杜绝 IndentationError)
      - name: Prepare Version Helper Script
        run: |
          cat << 'EOF' > /tmp/bump_module.py
          import sys
          from pathlib import Path
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          import tomli_w

          mode = sys.argv[1]
          file_path = Path(sys.argv[2])

          if mode == "read":
              try:
                  with open(file_path, "rb") as f:
                      data = tomllib.load(f)
                  ver = data.get("project", {}).get("version", "0.1.0")
                  print(ver.strip())
              except Exception:
                  print("0.1.0")

          elif mode == "write":
              new_ver = sys.argv[3]
              with open(file_path, "rb") as f:
                  data = tomllib.load(f)
              if "project" in data:
                  data["project"]["version"] = new_ver
              with open(file_path, "wb") as f:
                  tomli_w.dump(data, f)
          EOF

      # 5. 自动检索、前缀版本拼接并发布
      - name: Scan Modules and Auto-Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          set -e
          MODULE_ROOT="Module"

          if [ ! -d "$MODULE_ROOT" ]; then
            echo "⚠️ 未找到 $MODULE_ROOT 目录，流程跳过。"
            exit 0
          fi

          for mod_dir in "$MODULE_ROOT"/*; do
            if [ -d "$mod_dir" ]; then
              MODULE_NAME=$(basename "$mod_dir")
              echo "=========================================================="
              echo "📦 正在处理模块: [ $MODULE_NAME ] (路径: $mod_dir)"
              echo "=========================================================="

              # ==================== A. Python / PyPI ====================
              if [ -f "$mod_dir/pyproject.toml" ]; then
                (
                  cd "$mod_dir"
                  rm -rf dist/ build/ *.egg-info

                  # 1. 提取 pyproject.toml 中的原始版本号
                  CONFIG_VER=$(python3 /tmp/bump_module.py read pyproject.toml)

                  # 2. 拼接版本号：【文件中配置版本号】 + . + 【GitHub 流水号】
                  FINAL_PYPI_VER="${CONFIG_VER}.${RUN_NUM}"
                  echo "🐍 [PyPI] 文件配置基线: $CONFIG_VER ➔ 最终自动版本: $FINAL_PYPI_VER"

                  # 3. 动态更新 pyproject.toml 版本
                  python3 /tmp/bump_module.py write pyproject.toml "$FINAL_PYPI_VER"

                  # 4. 编译打包并发布
                  python3 -m build
                  if [ -n "$TWINE_PASSWORD" ]; then
                    twine upload --skip-existing --non-interactive dist/*
                    echo "✅ PyPI 发布完成: $MODULE_NAME@$FINAL_PYPI_VER"
                  else
                    echo "⚠️ 未配置 PYPI_API_TOKEN Secret，跳过发布。"
                  fi
                )
              fi

              # ==================== B. Node.js / npm ====================
              if [ -f "$mod_dir/package.json" ]; then
                (
                  cd "$mod_dir"
                  NPM_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "")
                  CONFIG_NPM_VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")

                  if [ -n "$NPM_NAME" ]; then
                    # 针对 npm 语义化三段式 (SemVer: X.Y.Z) 进行适配
                    FINAL_NPM_VER=$(node -e "
                      const ver = process.argv[1] || '0.1.0';
                      const run = process.argv[2] || '1';
                      const parts = ver.split('.');
                      if (parts.length >= 2) {
                        console.log(parts[0] + '.' + parts[1] + '.' + run);
                      } else {
                        console.log(ver + '.' + run);
                      }
                    " "$CONFIG_NPM_VER" "$RUN_NUM")

                    echo "🟢 [npm] 文件配置基线: $CONFIG_NPM_VER ➔ 最终自动版本: $FINAL_NPM_VER"

                    # 动态更新 package.json 版本号
                    npm version "$FINAL_NPM_VER" --no-git-tag-version --allow-same-version

                    if [ -n "$NODE_AUTH_TOKEN" ]; then
                      npm publish --access public
                      echo "✅ npm 发布完成: $NPM_NAME@$FINAL_NPM_VER"
                    else
                      echo "⚠️ 未配置 NPM_TOKEN Secret，跳过发布。"
                    fi
                  fi
                )
              fi

            fi
          done