name: Auto Build & Publish Modules to PyPI & npm

on:
  push:
    branches:
      - main
    paths:
      - 'Module/**'
      - '.github/workflows/Publish Modules to PyPI & npm.yml'
  workflow_dispatch:

jobs:
  auto-publish:
    name: Build & Auto-Version Publish
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安装 Python 环境与打包依赖
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade build twine tomli-w

      # 3. 安装 Node.js 22 LTS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 4. 自动检索、前缀版本拼接并发布 (语法 100% 纯净闭合)
      - name: Scan Modules and Auto-Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          set -e
          MODULE_ROOT="Module"

          if [ ! -d "$MODULE_ROOT" ]; then
            echo "⚠️ 未找到 $MODULE_ROOT 目录，流程跳过。"
            exit 0
          fi

          for mod_dir in "$MODULE_ROOT"/*; do
            if [ -d "$mod_dir" ]; then
              MODULE_NAME=$(basename "$mod_dir")
              echo "=========================================================="
              echo "📦 正在处理模块: [ $MODULE_NAME ] (路径: $mod_dir)"
              echo "=========================================================="

              # ==================== A. Python / PyPI ====================
              if [ -f "$mod_dir/pyproject.toml" ]; then
                pushd "$mod_dir" > /dev/null
                rm -rf dist/ build/ *.egg-info

                # 单行安全提取 pyproject.toml 基础版本号 (无换行、无嵌套括号)
                CONFIG_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('version', '0.1.0').strip())" 2>/dev/null || echo "0.1.0")

                # 拼接：【文件配置版本】 + . + 【流水号】 (如: 0.2.0.15)
                FINAL_PYPI_VER="${CONFIG_VER}.${RUN_NUM}"
                echo "🐍 [PyPI] 文件配置基线: $CONFIG_VER ➔ 最终自动版本: $FINAL_PYPI_VER"

                # 单行安全回写 pyproject.toml
                python3 -c "import tomli_w, tomllib; f='pyproject.toml'; d=tomllib.load(open(f, 'rb')); d.setdefault('project', {})['version']='$FINAL_PYPI_VER'; tomli_w.dump(d, open(f, 'wb'))"

                python3 -m build
                if [ -n "$TWINE_PASSWORD" ]; then
                  twine upload --skip-existing --non-interactive dist/*
                  echo "✅ PyPI 发布完成: $MODULE_NAME@$FINAL_PYPI_VER"
                else
                  echo "⚠️ 未配置 PYPI_API_TOKEN Secret，跳过发布。"
                fi
                popd > /dev/null
              fi

              # ==================== B. Node.js / npm ====================
              if [ -f "$mod_dir/package.json" ]; then
                pushd "$mod_dir" > /dev/null
                NPM_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "")
                CONFIG_NPM_VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")

                if [ -n "$NPM_NAME" ]; then
                  # 纯原生 Bash 极简提取 Major.Minor 并拼接，彻底规避跨行 JS 语法解析陷阱
                  MAJOR=$(echo "$CONFIG_NPM_VER" | cut -d. -f1)
                  MINOR=$(echo "$CONFIG_NPM_VER" | cut -d. -f2)
                  FINAL_NPM_VER="${MAJOR:-0}.${MINOR:-1}.${RUN_NUM}"
                  echo "🟢 [npm] 文件配置基线: $CONFIG_NPM_VER ➔ 最终自动版本: $FINAL_NPM_VER"

                  npm version "$FINAL_NPM_VER" --no-git-tag-version --allow-same-version

                  if [ -n "$NODE_AUTH_TOKEN" ]; then
                    npm publish --access public
                    echo "✅ npm 发布完成: $NPM_NAME@$FINAL_NPM_VER"
                  else
                    echo "⚠️ 未配置 NPM_TOKEN Secret，跳过发布。"
                  fi
                fi
                popd > /dev/null
              fi

            fi
          done