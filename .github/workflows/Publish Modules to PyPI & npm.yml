name: Auto Build & Publish Modules to PyPI & npm

on:
  push:
    branches:
      - main
    paths:
      - 'Module/**'
      - '.github/workflows/publish-modules.yml'
  workflow_dispatch:

jobs:
  auto-publish:
    name: Build & Auto-Version Publish
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安装 Python 环境与打包依赖
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade build twine tomli tomli-w

      # 3. 安装 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 4. 自动读取文件中配置的版本号，并拼接流水号进行打包发布
      - name: Prefix File Version and Auto-Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_NUM: ${{ github.run_number }} # 随仓库构建自动递增的流水号
        run: |
          set -e
          MODULE_ROOT="Module"

          if [ ! -d "$MODULE_ROOT" ]; then
            echo "⚠️ 未找到 $MODULE_ROOT 目录，流程跳过。"
            exit 0
          fi

          for mod_dir in "$MODULE_ROOT"/*; do
            if [ -d "$mod_dir" ]; then
              MODULE_NAME=$(basename "$mod_dir")
              echo "=========================================================="
              echo "📦 正在处理模块: [ $MODULE_NAME ] (路径: $mod_dir)"
              echo "=========================================================="

              # ==================== A. Python / PyPI ====================
              if [ -f "$mod_dir/pyproject.toml" ]; then
                (
                  cd "$mod_dir"
                  rm -rf dist/ build/ *.egg-info

                  # 1. 读取 pyproject.toml 中用户配置的基础版本号 (如 0.2.0)
                  CONFIG_VER=$(python3 -c "
                  import tomli
                  with open('pyproject.toml', 'rb') as f:
                      cfg = tomli.load(f)
                  print(cfg.get('project', {}).get('version', '0.1.0').strip())
                  ")

                  # 2. 拼接：【文件中配置的版本号】 + . + 【自动自增编号】
                  # 例如: 0.2.0 -> 拼装为 0.2.0.1, 0.2.0.2...
                  FINAL_PYPI_VER="${CONFIG_VER}.${RUN_NUM}"
                  echo "🐍 [PyPI] 文件配置基线: $CONFIG_VER ➔ 最终自动版本: $FINAL_PYPI_VER"

                  # 3. 动态更新内存中的 pyproject.toml 进行打包
                  python3 -c "
                  import tomli, tomli_w
                  with open('pyproject.toml', 'rb') as f:
                      data = tomli.load(f)
                  if 'project' in data:
                      data['project']['version'] = '$FINAL_PYPI_VER'
                  with open('pyproject.toml', 'wb') as f:
                      tomli_w.dump(data, f)
                  "

                  # 4. 编译并推送到 PyPI
                  python3 -m build
                  if [ -n "$TWINE_PASSWORD" ]; then
                    twine upload --skip-existing --non-interactive dist/*
                    echo "✅ PyPI 发布完成: $MODULE_NAME@$FINAL_PYPI_VER"
                  else
                    echo "⚠️ 未配置 PYPI_API_TOKEN Secret，跳过发布。"
                  fi
                )
              fi

              # ==================== B. Node.js / npm ====================
              if [ -f "$mod_dir/package.json" ]; then
                (
                  cd "$mod_dir"
                  NPM_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "")
                  CONFIG_NPM_VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")

                  if [ -n "$NPM_NAME" ]; then
                    # 适配 npm 的 SemVer (X.Y.Z) 规范：
                    # 取文件前两段 (如 0.2) + 自动自增号 (如 1) ➔ 0.2.1, 0.2.2
                    FINAL_NPM_VER=$(node -e "
                      const ver = '$CONFIG_NPM_VER';
                      const run = '$RUN_NUM';
                      const parts = ver.split('.');
                      if (parts.length >= 2) {
                        console.log(parts[0] + '.' + parts[1] + '.' + run);
                      } else {
                        console.log(ver + '.' + run);
                      }
                    ")

                    echo "🟢 [npm] 文件配置基线: $CONFIG_NPM_VER ➔ 最终自动版本: $FINAL_NPM_VER"

                    # 动态更新 package.json 版本号
                    npm version "$FINAL_NPM_VER" --no-git-tag-version --allow-same-version

                    if [ -n "$NODE_AUTH_TOKEN" ]; then
                      npm publish --access public
                      echo "✅ npm 发布完成: $NPM_NAME@$FINAL_NPM_VER"
                    else
                      echo "⚠️ 未配置 NPM_TOKEN Secret，跳过发布。"
                    fi
                  fi
                )
              fi

            fi
          done