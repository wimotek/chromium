name: Build and Push Multi-Arch Nginx Images

on:
  push:
    branches:
      - main
    paths:
      - 'nginx/**'
      - '.github/workflows/build_nginx.yml'
    tags:
      - 'nginx-v*.*.*'
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'Nginx 版本（latest=自动取官方最新、stable=官方最新稳定版、或填精确版本号如 1.27.5）'
        required: false
        default: 'latest'
        type: string
      enable_gzip_static:
        description: '自定义开启 http_gzip_static_module（预压缩 .gz 直出）'
        required: false
        default: false
        type: boolean
      enable_brotli:
        description: '自定义开启 ngx_brotli 模块（.br 压缩）'
        required: false
        default: false
        type: boolean
      enable_headers_more:
        description: '自定义开启 headers-more-nginx-module'
        required: false
        default: false
        type: boolean
      enable_zstd:
        description: '自定义开启 zstd-nginx-module'
        required: false
        default: false
        type: boolean
      extra_configure_args:
        description: '追加自定义 ./configure 编译参数（如 --with-http_gzip_static_module）'
        required: false
        default: ''
        type: string
      tag_suffix:
        description: '可选镜像标签后缀（例如填 gzip-static 将推送 <版本号>-gzip-static 标签）'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: ./nginx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Latest Nginx Version & Build Args
        id: nginx_meta
        shell: bash
        env:
          INPUT_NGINX_VERSION: ${{ inputs.nginx_version }}
          INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          REQ_VER="${INPUT_NGINX_VERSION:-latest}"

          if [ "${REQ_VER}" = "latest" ] || [ -z "${REQ_VER}" ]; then
            NGINX_VER="$(curl -fsSL https://nginx.org/download/ \
              | grep -Eo 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed -E 's/^nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz$/\1/' \
              | sort -V | tail -n 1)"
          elif [ "${REQ_VER}" = "stable" ]; then
            NGINX_VER="$(curl -fsSL https://nginx.org/download/ \
              | grep -Eo 'nginx-[0-9]+\.[0-9]*[02468]\.[0-9]+\.tar\.gz' \
              | sed -E 's/^nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz$/\1/' \
              | sort -V | tail -n 1)"
          else
            NGINX_VER="${REQ_VER}"
          fi

          if [ -z "${NGINX_VER}" ]; then
            echo "Failed to resolve Nginx version from nginx.org" >&2
            exit 1
          fi

          MAJOR_MINOR="$(echo "${NGINX_VER}" | cut -d'.' -f1,2)"
          TAG_SUFFIX="$(printf '%s' "${INPUT_TAG_SUFFIX:-}" | tr -cd 'a-zA-Z0-9._-')"

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            DOCKERHUB_ENABLED="true"
          else
            DOCKERHUB_ENABLED="false"
          fi

          echo "Resolved Nginx version: ${NGINX_VER} (minor: ${MAJOR_MINOR}, dockerhub: ${DOCKERHUB_ENABLED})"
          echo "nginx_version=${NGINX_VER}" >> "$GITHUB_OUTPUT"
          echo "nginx_major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${DOCKERHUB_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.nginx_meta.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Versioned Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ secrets.DOCKERHUB_USERNAME || 'disabled' }}/nginx,enable=${{ steps.nginx_meta.outputs.dockerhub_enabled == 'true' }}
            ghcr.io/${{ github.repository_owner }}/nginx
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.nginx_meta.outputs.tag_suffix == '' }}
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_version }},enable=${{ steps.nginx_meta.outputs.tag_suffix == '' }}
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_major_minor }},enable=${{ steps.nginx_meta.outputs.tag_suffix == '' }}
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_version }}-alpine,enable=${{ steps.nginx_meta.outputs.tag_suffix == '' }}
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_version }}-${{ steps.nginx_meta.outputs.tag_suffix || 'custom' }},enable=${{ steps.nginx_meta.outputs.tag_suffix != '' }}
            type=raw,value=${{ steps.nginx_meta.outputs.tag_suffix || 'custom' }},enable=${{ steps.nginx_meta.outputs.tag_suffix != '' }}
            type=semver,pattern={{version}}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.nginx_meta.outputs.nginx_version }}
          build-args: |
            NGINX_VERSION=${{ steps.nginx_meta.outputs.nginx_version }}
            ENABLE_GZIP_STATIC=${{ inputs.enable_gzip_static == true && 'true' || 'false' }}
            ENABLE_BROTLI=${{ inputs.enable_brotli == true && 'true' || 'false' }}
            ENABLE_HEADERS_MORE=${{ inputs.enable_headers_more == true && 'true' || 'false' }}
            ENABLE_ZSTD=${{ inputs.enable_zstd == true && 'true' || 'false' }}
            NGINX_EXTRA_CONFIGURE_ARGS=${{ inputs.extra_configure_args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        if: steps.nginx_meta.outputs.dockerhub_enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/nginx
          readme-filepath: ${{ env.WORKING_DIR }}/README.md
          short-description: "Zero-DB non-root Nginx microkernel (auto-latest versioned tags, WordPress/PHP-FPM ready, customizable gzip_static/Brotli/Zstd build args)"