# 1. 顶部全局定义工作目录与镜像变量
env:
  WORKING_DIR: ./nginx
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nginx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 动态探测底层 Alpine 的 Nginx 版本
      - name: Detect Nginx Upstream Version
        id: nginx_meta
        run: |
          RAW_VER=$(docker run --rm alpine:3.20 sh -c "apk add --no-cache nginx >/dev/null 2>&1 && nginx -v 2>&1 | cut -d'/' -f2")
          echo "nginx_version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "nginx_major_minor=$(echo "$RAW_VER" | cut -d'.' -f1,2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_version }},enable=true
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_major_minor }},enable=true
            type=raw,value=${{ steps.nginx_meta.outputs.nginx_version }}-alpine,enable=true
            type=semver,pattern={{version}}

      # 2. 全面使用 ${{ env.WORKING_DIR }}，零硬编码
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. 文档同步同样绑定变量
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          readme-filepath: ${{ env.WORKING_DIR }}/README.md
          short-description: "⚡ 极轻(~28MB)无数据库 Nginx 可视化微内核，自适应现代 Web UI，解耦动态 PHP"