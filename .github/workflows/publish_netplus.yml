name: Compile Source & Publish Multi-Arch Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'netplus/**'
      - '.github/workflows/publish_netplus.yml'
  workflow_dispatch:

env:
  WORKING_DIR: ./netplus
  IMAGE_NAME: netplus
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  GHCR_IMAGE: ghcr.io/wimotek/netplus

jobs:
  # ============================================================================
  # Job 1: Compile & Verify Source Code FIRST (Gatekeeper before Image Push)
  # ============================================================================
  compile-and-verify:
    name: Compile Source & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

      - name: Type-check TypeScript (tsc --noEmit)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run lint

      - name: Compile frontend (Vite) & bundle backend (esbuild)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm run build
          npm run build:server
          test -f dist/index.html
          test -f dist-server/server.mjs
          ls -lh dist/index.html dist-server/server.mjs

      - name: Production runtime smoke test on compiled bundle
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          DATA_DIR=/tmp/netplus-ci-smoke
          rm -rf "$DATA_DIR" && mkdir -p "$DATA_DIR"
          NODE_ENV=production \
          PORT=3099 \
          HTTPS_PORT=0 \
          DATA_DIR="$DATA_DIR" \
          node dist-server/server.mjs > /tmp/netplus-ci-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3099/api/health > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          echo "Health check response:"
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo "Checking compiled frontend index.html:"
          curl -fsS http://127.0.0.1:3099/ | grep -qi "<!doctype html>"

          echo "Verifying backend bundle is NOT exposed under static dist/:"
          if curl -fsS http://127.0.0.1:3099/server.mjs | grep -q "createServer"; then
            echo "ERROR: server.mjs was exposed via static middleware!"
            exit 1
          fi
          echo "Compile & smoke test passed."

      - name: Upload compiled dist & dist-server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-release-artifacts
          path: |
            ${{ env.WORKING_DIR }}/dist/
            ${{ env.WORKING_DIR }}/dist-server/
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # Job 2: Package Pre-Compiled Artifacts & Push Multi-Arch Docker Image
  # Runs ONLY after compile-and-verify succeeds.
  # ============================================================================
  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: [compile-and-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified compiled artifacts (dist/ & dist-server/)
        uses: actions/download-artifact@v4
        with:
          name: compiled-release-artifacts
          path: ${{ env.WORKING_DIR }}

      - name: Verify downloaded build artifacts
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          test -f dist/index.html
          test -f dist-server/server.mjs

      # ------------------------------------------------------------------------
      # Detect Docker Hub credentials WITHOUT referencing secrets in `if:`
      # Pattern mirrors build_nginx.yml: shell checks secrets, emits an output.
      # ------------------------------------------------------------------------
      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected — will push to ${DOCKERHUB_USERNAME}/${IMAGE_NAME}."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=wimotek/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — skipping Docker Hub."
          fi

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (GHCR + Docker Hub)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_REGISTRY }}/${{ steps.dockerhub.outputs.image }},enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch container image from compiled artifacts
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true