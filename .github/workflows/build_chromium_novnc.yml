name: Build noVNC Edition

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'chromium_novnc/**'                          # 仅当 novnc 目录变动时触发
      - '.github/workflows/build-novnc.yml'
    tags: [ 'v*.*.*' ]
  workflow_dispatch:                        # 支持网页手动单独点击触发

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/minimal-chromium

jobs:
  build-novnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=novnc
            type=semver,pattern={{version}}-novnc

      - name: Build and push noVNC
        uses: docker/build-push-action@v6
        with:
          context: ./chromium_novnc                   # 指定构建目录为 novnc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
