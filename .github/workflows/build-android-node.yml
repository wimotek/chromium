name: Build & Release Android Edge Node

on:
  push:
    branches:
      - main
      - master
    paths:
      - "chromium/chromium_android/**"
      - ".github/workflows/build-android-node.yml"
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish APK to GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag when triggered manually (e.g. android-v1.0.0)"
        required: false
        type: string
        default: "android-v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Determine release version & tag
        id: rel_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#android-v}"
            [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VER="1.0.0"
            SHOULD="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            TAG="${TAG:-android-v1.0.0}"
            VER="${TAG#android-v}"
            [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VER="1.0.0"
            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              SHOULD="true"
            else
              SHOULD="false"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            LATEST_TAG="$(git ls-remote --tags --refs origin 'android-v*' | sed -E 's|.*refs/tags/||' | grep -E '^android-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "$LATEST_TAG" ]]; then
              VER="1.0.0"
            else
              BASE="${LATEST_TAG#android-v}"
              IFS='.' read -r MAJ MIN PAT <<< "$BASE"
              VER="${MAJ}.${MIN}.$((PAT + 1))"
            fi
            TAG="android-v${VER}"
            SHOULD="true"
          else
            VER="1.0.0"
            TAG=""
            SHOULD="false"
          fi
          echo "Resolved release tag=$TAG, app_version=$VER, version_code=${{ github.run_number }}, should_release=$SHOULD"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        working-directory: chromium/chromium_android
        run: gradle assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ steps.rel_meta.outputs.app_version }}

      - name: Package release assets & SHA256SUMS
        run: |
          mkdir -p release_assets_android
          cp chromium/chromium_android/app/build/outputs/apk/release/app-release.apk \
            release_assets_android/WimotekEdgeNode-android.apk
          cp chromium/chromium_android/README.md release_assets_android/README.md
          (cd release_assets_android && sha256sum WimotekEdgeNode-android.apk > SHA256SUMS.txt)
          ls -lh release_assets_android/
          cat release_assets_android/SHA256SUMS.txt

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WimotekEdgeNode-android
          path: release_assets_android/*
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.rel_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag }}
          name: "Wimotek Android Edge Node ${{ steps.rel_meta.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_assets_android/WimotekEdgeNode-android.apk
            release_assets_android/SHA256SUMS.txt
