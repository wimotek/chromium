name: Build and Push Sync Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'chromium/chromium_sync/**'
  workflow_dispatch:

env:
  WORKING_DIR: ./chromium/chromium_sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry (GHCR)
      - name: 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录到 Docker Hub
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送到两个镜像仓库
      - name: 编译并推送到 GHCR 和 Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: true
          tags: |
            ghcr.io/wimotek/chromium:sync
            ${{ secrets.DOCKERHUB_USERNAME }}/chromium:sync
          cache-from: type=gha
          cache-to: type=gha,mode=max