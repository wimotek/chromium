services:
  chromium-sync:
    image: ghcr.io/wimotek/chromium:sync
    container_name: cdp_sync_manager
    pull_policy: always    # 每次启动都会先尝试从远程拉取最新镜像
    restart: unless-stopped
    ports:
      - "8080:8080"
      # 本地转发的 CDP 端口段
      - "19200-19250:19200-19250"
    volumes:
      - ./data:/data
    environment:
      - ADMIN_INIT_PASS=Admin@123456