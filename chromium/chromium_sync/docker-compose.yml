services:
  chromium-sync:
    build: .
    container_name: cdp_sync_manager
    restart: unless-stopped
    ports:
      # HTTPS 管理端口（如需直接使用 443 访问，可改为 "443:8443"）
      - "8443:8443"
      # 本地转发的 CDP 端口段
      - "19200-19250:19200-19250"
    volumes:
      - ./data:/data
      # 映射外部 SSL 证书目录（留空则容器自动生成自签证书）
      - ./certs:/certs
    environment:
      - ADMIN_INIT_PASS=Admin@123456