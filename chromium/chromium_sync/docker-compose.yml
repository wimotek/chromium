version: '3.8'

services:
  chromium-sync:
    image: ghcr.io/wimotek/chromium:sync
    container_name: cdp_sync_manager
    restart: unless-stopped
    ports:
      - "8080:8080"
      # 本地转发的 CDP 端口段
      - "19200-19250:19200-19250"
    volumes:
      - ./data:/data
    environment:
      - ADMIN_INIT_PASS=Admin@123456
      - JWT_SECRET=cdp-sync-super-secret-key-change-me
      - DATA_DIR=/data