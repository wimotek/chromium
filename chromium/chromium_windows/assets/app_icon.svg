<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#132245"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09122a"/>
    </linearGradient>
  </defs>

  <!-- Windows 11 Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-opacity="0.55"/>

  <!-- Subtle Outer Network Orbit Arcs -->
  <path d="M 118 190 A 152 152 0 0 1 322 118" fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 394 322 A 152 152 0 0 1 190 394" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>

  <!-- Edge Node Dots on Orbit -->
  <circle cx="322" cy="118" r="18" fill="#5eead4"/>
  <circle cx="190" cy="394" r="18" fill="#38bdf8"/>
  <circle cx="118" cy="190" r="14" fill="#38bdf8" fill-opacity="0.85"/>
  <circle cx="394" cy="322" r="14" fill="#2dd4bf" fill-opacity="0.85"/>

  <!-- Central Hexagonal Security Shield -->
  <polygon points="256,126 362,178 352,298 256,382 160,298 150,178" fill="url(#shieldGrad)" stroke="url(#cyanGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Stylized 'W' / Electric Sync Pulse inside Shield -->
  <polyline points="188,224 220,298 256,232 292,298 324,224" fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Node Crown Dot -->
  <circle cx="256" cy="178" r="12" fill="#e0f2fe"/>
</svg>
