services:
  chromium-sync-saas:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: cdp_sync_saas_hub
    restart: unless-stopped
    ports:
      # 注意：ports 中的 ${...} 在宿主机解析，只读取同目录 .env 文件或启动命令传入的环境变量（不能引用下方 environment: 里写死的值）。
      # - HUB_BIND_ADDR：宿主机绑定网卡，默认 0.0.0.0；前置 Nginx/宝塔反代时建议设 127.0.0.1（如 HUB_BIND_ADDR=127.0.0.1 docker compose up -d）
      # - HUB_HOST_PORT：宿主机对外暴露端口，未设置时依次回退 HUB_EXTERNAL_PORT -> HUB_PORT -> 8443
      - "${HUB_BIND_ADDR:-0.0.0.0}:${HUB_HOST_PORT:-${HUB_EXTERNAL_PORT:-${HUB_PORT:-8443}}}:${HUB_PORT:-8443}"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      - HUB_HOST=${HUB_HOST:-::}
      - HUB_PORT=${HUB_PORT:-8443}
      - HUB_SERVE_FRONTEND=${HUB_SERVE_FRONTEND:-true}
      - HUB_EXTERNAL_PORT=${HUB_EXTERNAL_PORT:-}
      - HUB_PUBLIC_HOST=${HUB_PUBLIC_HOST:-}
      # SaaS 开放运营与平台差价抽成配置
      - SAAS_ALLOW_PUBLIC_REGISTER=${SAAS_ALLOW_PUBLIC_REGISTER:-true}
      - SAAS_ALLOW_SELF_RECHARGE=${SAAS_ALLOW_SELF_RECHARGE:-true}
      # 平台加价率（基点 bps：2000 = 买家在卖家底价基础上加价 20%，差价归平台利润）
      - SAAS_PLATFORM_FEE_BPS=${SAAS_PLATFORM_FEE_BPS:-2000}
      # 新注册用户赠送体验余额（单位：毫厘 0.0001 元；50000 = 5.00 元）
      - SAAS_WELCOME_BONUS_UNITS=${SAAS_WELCOME_BONUS_UNITS:-50000}
      # 主数据库 ORM 与高速缓存配置
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - MYSQL_HOST=${MYSQL_HOST:-127.0.0.1}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-chromium_sync_saas}
      - REDIS_URL=${REDIS_URL:-}
      - EDGE_AGENT_ALLOW_NON_PUBLIC_PROBE=${EDGE_AGENT_ALLOW_NON_PUBLIC_PROBE:-false}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, ssl, urllib.request; p = os.getenv('HUB_PORT') or '8443'; fe = (os.getenv('HUB_SERVE_FRONTEND') or 'true').strip().lower() not in ('0','false','no','off'); sch = 'https' if fe else 'http'; ctx = ssl._create_unverified_context() if fe else None; urllib.request.urlopen(f'{sch}://127.0.0.1:{p}/api/auth/status', context=ctx, timeout=3)\" || python3 -c \"import os, ssl, urllib.request; p = os.getenv('HUB_PORT') or '8443'; fe = (os.getenv('HUB_SERVE_FRONTEND') or 'true').strip().lower() not in ('0','false','no','off'); sch = 'https' if fe else 'http'; ctx = ssl._create_unverified_context() if fe else None; urllib.request.urlopen(f'{sch}://[::1]:{p}/api/auth/status', context=ctx, timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
