services:
  xray-web:
    image: wimotek/xray:web
    container_name: xray-web
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - AUTO_UPDATE=true
      - PORT=443
      - DEST=www.apple.com:443
      - SERVER_NAMES=www.apple.com,apple.com
      - WEB_ENABLE=true
      - WEB_PORT=3000
      - WEB_PASSWORD=admin888
    volumes:
      # 宿主机 ./data 映射到容器内部 /data（宿主机绝不会出现模板文件）
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"