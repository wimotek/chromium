<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xray Reality 控制台</title>
  </head>
  <body style="margin: 0; background-color: #080c14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="app">
      <div id="xray-boot-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box;">
        <div style="font-size:16px;font-weight:700;color:#38bdf8;letter-spacing:1px;">⚡ XRAY REALITY 控制台加载中...</div>
        <div id="xray-boot-sub" style="margin-top:8px;font-size:12px;color:#64748b;">正在拉取前端脚本与样式资源，首次加载请稍候</div>
        <div id="xray-boot-hint" style="display:none;margin-top:14px;max-width:460px;padding:14px 18px;border-radius:10px;background:#0f172a;border:1px solid rgba(245,158,11,0.45);color:#cbd5e1;font-size:13px;line-height:1.7;">
          <div id="xray-boot-title" style="color:#fbbf24;font-weight:700;margin-bottom:6px;">网络响应较慢，仍在继续加载资源...</div>
          <div id="xray-boot-err" style="display:none;font-family:monospace;font-size:12px;color:#fbbf24;word-break:break-all;margin-bottom:8px;"></div>
          <div>若长时间未进入界面（或通过 <b>Cloudflare CDN</b> 访问遇到缓存异常），请尝试：<br/>1. 点击下方按钮或按 <b>Ctrl + F5</b> 强制刷新（或清理 Cloudflare 边缘缓存）<br/>2. 在 Cloudflare 控制台关闭 <b>Rocket Loader</b> 后重试</div>
          <div style="margin-top:12px;">
            <button type="button" onclick="location.reload()" style="background:#0284c7;color:#fff;border:none;padding:6px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">🔄 重新加载</button>
          </div>
        </div>
      </div>
    </div>
    <script data-cfasync="false">
      window.__xrayAppMounted = false;
      window.__xrayBootFailed = false;
      function __xrayShowBootHint(msg, isError) {
        if (window.__xrayAppMounted) return;
        var box = document.getElementById('xray-boot-hint');
        var titleEl = document.getElementById('xray-boot-title');
        var errEl = document.getElementById('xray-boot-err');
        if (box) {
          box.style.display = 'block';
          if (isError) {
            window.__xrayBootFailed = true;
            box.style.borderColor = 'rgba(248,113,113,0.45)';
          }
        }
        if (titleEl && isError) {
          titleEl.style.color = '#f87171';
          titleEl.textContent = '前端脚本未能正常启动';
        }
        if (errEl && msg) {
          errEl.style.display = 'block';
          errEl.textContent = msg;
        }
      }
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? e.message : '资源加载失败';
        __xrayShowBootHint(msg, true);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '异步模块加载失败';
        __xrayShowBootHint(reason, true);
      });
      setTimeout(function () {
        if (!window.__xrayAppMounted && !window.__xrayBootFailed) {
          __xrayShowBootHint('', false);
        }
      }, 10000);
    </script>
    <script data-cfasync="false" type="module" src="/src/main.js" onerror="__xrayShowBootHint('主模块脚本加载失败，请检查网络或刷新重试', true)"></script>
  </body>
</html>
