<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xray Reality 控制台</title>
  </head>
  <body style="margin: 0; background-color: #080c14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="app">
      <div id="xray-boot-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box;">
        <div style="font-size:16px;font-weight:700;color:#38bdf8;letter-spacing:1px;">⚡ XRAY REALITY 控制台加载中...</div>
        <div id="xray-boot-hint" style="display:none;margin-top:14px;max-width:460px;padding:14px 18px;border-radius:10px;background:#0f172a;border:1px solid rgba(248,113,113,0.4);color:#cbd5e1;font-size:13px;line-height:1.7;">
          <div style="color:#f87171;font-weight:700;margin-bottom:6px;">前端脚本未能正常启动</div>
          <div id="xray-boot-err" style="font-family:monospace;font-size:12px;color:#fbbf24;word-break:break-all;margin-bottom:8px;"></div>
          <div>若通过 <b>Cloudflare CDN</b> 访问遇到此情况，请尝试：<br/>1. 按 <b>Ctrl + F5</b> 强制刷新（或清理 Cloudflare 边缘缓存）<br/>2. 在 Cloudflare 控制台关闭 <b>Rocket Loader</b> 后重试</div>
        </div>
      </div>
    </div>
    <script data-cfasync="false">
      window.__xrayAppMounted = false;
      function __xrayShowBootHint(msg) {
        if (window.__xrayAppMounted) return;
        var box = document.getElementById('xray-boot-hint');
        var errEl = document.getElementById('xray-boot-err');
        if (box) box.style.display = 'block';
        if (errEl && msg) errEl.textContent = msg;
      }
      window.addEventListener('error', function (e) {
        __xrayShowBootHint(e && e.message ? e.message : '');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        __xrayShowBootHint(reason);
      });
      setTimeout(function () {
        __xrayShowBootHint('');
      }, 6000);
    </script>
    <script data-cfasync="false" type="module" src="/src/main.js"></script>
  </body>
</html>
