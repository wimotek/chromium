[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wimotek-edge-agent"
version = "1.0"
description = "Universal Edge Reverse Proxy & Service Bridge Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Wimotek", email = "wimotek@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.24.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
wimotek-edge-agent = "wimotek_edge_agent.agent:main"
wimotek-agent = "wimotek_edge_agent.agent:main"
edge-agent = "wimotek_edge_agent.agent:main"

[tool.setuptools]
packages = ["wimotek_edge_agent"]

[tool.setuptools.package-data]
wimotek_edge_agent = ["py.typed"]