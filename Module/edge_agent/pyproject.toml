[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wimotek-edge-agent"
version = "1.0.0"
description = "Universal Edge Reverse Proxy & Service Bridge Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "websockets>=11.0",
]

[project.scripts]
edge-agent = "wimotek_edge_agent.agent:main"
wimotek-agent = "wimotek_edge_agent.agent:main"